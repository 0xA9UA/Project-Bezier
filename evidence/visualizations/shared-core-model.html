        stroke3(compared,colors.compared,2.2,.75,[5,4]);
        stroke3(chosen,colors.chosen,3.4);
        const here=paths.chosen[0],q=project(here),corePoint=project([0,0,0]);
        ctx.save();ctx.strokeStyle=colors.core;ctx.globalAlpha=.8;ctx.lineWidth=1.5;ctx.setLineDash([3,4]);
        const reach=size.w<450?37:52;
        ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.quadraticCurveTo(q.x-reach,q.y-reach,corePoint.x,corePoint.y);ctx.stroke();ctx.restore();
        dot(here,colors.fg,5,1,true);
        dot([0,0,0],colors.core,3.5);
        const keyWidth=size.w<450?85:110;
        stroke3([[0,0,0],[0,.43,0]],colors.core,1,.6);
        label('Shared core',[0,.43,0],keyWidth*.05,-10,'center');
        label('r = 0.25',[0,.43,0],keyWidth*.05,9,'center');
        label('Input',data.initial[0],-3,18,'center');
        label('Output',data.initial[3],0,18,'center');
        ctx.fillStyle=colors.fg;ctx.fillText(`Checkpoint ${state.stage+1}`,12,19);
        ctx.fillStyle=colors.muted;ctx.fillText('Activation + geometry → core',12,40);
      } else {
        const layer=data.layers[state.stage], skipChosen=new Set(layer.excluded[paths.chosenKey]),skipCompared=new Set(layer.excluded[paths.comparedKey]);
        const shared=[],different=[];
        for(const p of layer.nodes){
          const c=!skipChosen.has(p[3]),b=!skipCompared.has(p[3]),q=project(p);
          const entry={p,q,c,b};if(c===b)shared.push(entry);else different.push(entry);
        }
        for(const {p,q,c,b}of shared){dot(p,colors.fg,c?.9:1.3,c?.16:.35);screenPoints.push({p,x:q.x,y:q.y,c,b});}
        for(const {p,q,c,b}of different){dot(p,c?colors.chosen:colors.compared,2.6,.9);screenPoints.push({p,x:q.x,y:q.y,c,b});}
        // Curves in world coordinates provide orientation beside the magnified node cloud.
        stroke3(compared,colors.compared,2,.6,[5,4]);stroke3(chosen,colors.chosen,3,.85);
        ctx.fillStyle=colors.fg;ctx.fillText(`MLP neurons · block ${state.stage===0?12:23}`,12,19);
        ctx.fillStyle=colors.muted;ctx.fillText('Selected by distance to the curve',12,40);
      }
      drawAxes();
      if(selectedNode){
        const q=project(selectedNode.p);ctx.save();ctx.strokeStyle=colors.fg;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(q.x,q.y,6,0,Math.PI*2);ctx.stroke();ctx.restore();
      }
      if(amount<1)requestDraw();
    }
    function requestDraw(){if(!frame)frame=requestAnimationFrame(draw);}
    function update(animate=true) {
      const before=candidates();
      previousCurves=[sampled(before.chosen),sampled(before.compared)];
      if(animate&&!reduced.matches)transitionStart=performance.now();else transitionStart=0;
      selectedNode=null;
      root.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===state.view)));
      root.querySelectorAll('[data-legend]').forEach(el=>{el.hidden=el.dataset.legend!==state.view;});
      const row=currentCase(),paths=candidates(),layer=data.layers[state.stage];
      let changed=0;
      const ca=new Set(layer.excluded[paths.chosenKey]),cb=new Set(layer.excluded[paths.comparedKey]);
      for(const value of ca)if(!cb.has(value))changed++;
      values.scope.textContent=state.view==='sphere'?'6,000 of 987,136 actual node coordinates':`${format(layer.nodes.length)} neurons shown · ${format(layer.active)} of ${format(layer.count)} execute`;
      values.count.textContent=state.view==='sphere'?'Central sphere · fixed position':`${format(changed)} neurons replaced at equal budget`;
      values.outcome.textContent=`Saved answer ${row.predicted} ${row.correct?'✓':'✕'} · fixed-route answer ${row.fixed_predicted} ${row.fixed_correct?'✓':'✕'} · correct answer ${row.answer}`;
      values.node.textContent=state.view==='sphere'?'Drag to rotate · Select a node to inspect its coordinates':'98% node budget · Select a neuron to inspect its coordinates';
      const currentAction=row.actions[state.stage];
      [...controls.compare.options].forEach(option=>{option.textContent=(Number(option.value)===0?'Continue the curve':actionNames[Number(option.value)])+(Number(option.value)===currentAction?' · chosen':'');});
      requestDraw();
    }
    for(const [name,control]of Object.entries(controls))control.addEventListener('change',()=>{
      const old=candidates();
      state[name==='case'?'caseIndex':name]=Number(control.value);
      if(name==='case'||name==='stage'){
        const action=currentCase().actions[state.stage];
        if(state.compare===action){state.compare=action===1?2:1;controls.compare.value=String(state.compare);}
      }
      update(false);previousCurves=[sampled(old.chosen),sampled(old.compared)];
      if(!reduced.matches)transitionStart=performance.now();
    });
    root.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{state.view=button.dataset.view;update(false);}));
    root.querySelector('[data-action="left"]').addEventListener('click',()=>{state.yaw-=Math.PI/7;requestDraw();});
    root.querySelector('[data-action="reset"]').addEventListener('click',()=>{state.yaw=-.67;state.pitch=.35;requestDraw();});
    let pointer=null;
    canvas.addEventListener('pointerdown',event=>{pointer={id:event.pointerId,x:event.clientX,y:event.clientY,startX:event.clientX,startY:event.clientY};canvas.setPointerCapture(event.pointerId);});
    canvas.addEventListener('pointermove',event=>{
      if(!pointer)return;
      state.yaw+=(event.clientX-pointer.x)*.008;
      state.pitch=Math.max(-1.3,Math.min(1.3,state.pitch+(event.clientY-pointer.y)*.007));
      pointer.x=event.clientX;pointer.y=event.clientY;requestDraw();
    });
    canvas.addEventListener('pointerup',event=>{
      if(!pointer)return;
      const moved=Math.hypot(event.clientX-pointer.startX,event.clientY-pointer.startY);
      pointer=null;
      if(moved>5)return;
      const rect=canvas.getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top;
      const hit=screenPoints.reduce((best,p)=>{const d=(p.x-x)**2+(p.y-y)**2;return d<best.d?{p,d}:best;},{p:null,d:90});
      if(!hit.p)return;
      selectedNode=hit.p;
      const p=hit.p.p;
      if(state.view==='sphere'){
        const group=data.groups.find(g=>p[3]>=g.start&&p[3]<g.start+g.count);
        values.node.textContent=`${group.name} · node ${format(p[3]-group.start)} · (${p.slice(0,3).map(v=>v.toFixed(3)).join(', ')}) · ${format(group.parameters_per_node)} shared weights${hit.p.core?' · inside core':''}`;
      }else{
        values.node.textContent=`Neuron ${format(p[3])} · (${p.slice(0,3).map(v=>v.toFixed(3)).join(', ')}) · ${hit.p.c?'chosen path executes':'chosen path skips'} · ${format(data.layers[state.stage].parameters_per_node)} weights`;
      }
      requestDraw();
    });
    canvas.addEventListener('pointercancel',()=>{pointer=null;});
    function resize(){const rect=canvas.getBoundingClientRect();size={w:rect.width,h:rect.height};const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(size.w*dpr);canvas.height=Math.round(size.h*dpr);requestDraw();}
    data.layers.forEach(layer=>{layer.radius=Math.max(...layer.nodes.map(p=>Math.hypot(p[0],p[1],p[2])));});
    new ResizeObserver(resize).observe(canvas);
    new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    theme();update(false);resize();
    root.dataset.ready='true';
  })();
  </script>
</div>
